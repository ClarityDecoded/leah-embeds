<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Soul Stories — ══════════ THE WELCOME ══════════</title>

</head>
<body>
<!-- ===== BLOCK 2 — ══════════ THE WELCOME ══════════ ===== (page: soul-stories) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   SOUL STORIES
   Ground, heat, green and violet all measured out of Leah's own
   photographs. The page is laid the way a danmala is laid:
   natural material on dark earth, until a pattern appears.
   ══════════════════════════════════════════════════════════════ */
:root{
  /* ── the earth. sampled from the soil of the autumn danmala ── */
  --earth:#0C0B0D;         /* the hero's own soil, measured at its edge */
  --earth-lift:#1A1622;    /* soil lifted toward the violet in it */

  /* ── the light ── */
  --cream:#F6F0E2;
  --ink:#2C2822;
  --ink-soft:#4A443B;
  --dust:#DCD5C2;          /* body copy where the ground is earth */

  /* ── the heat ── */
  --rust:#8E3B2A;
  --marigold:#E0930F;
  --wash:#F4E8CF;          /* marigold at 9% composited onto cream, solid */
  --vermilion:#C63C1A;     /* measured #C7472A across all seven photographs */
  --gold:#E2C143;          /* measured — the heat that survives on earth */

  /* ── the cold. exiled by the old canon, returned here ── */
  --cedar:#6C944B;         /* measured — the canon had this at #3F7548, too dark */
  --plum:#9E5782;          /* measured — bougainvillea, mauve leaves, the soil's cast */
  --lapis:#1D5B6B;

  --display:'Cormorant Garamond', Georgia, serif;
  --body: Georgia, 'Times New Roman', serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink-soft);
  font-family:var(--body);
  font-size:19px;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:760px;margin:0 auto;padding:0 28px;}
.wide{max-width:1120px;margin:0 auto;padding:0 28px;}
p{margin:0 0 22px;}
p:last-child{margin-bottom:0;}

/* ── rhythm. not every section breathes the same ────────────── */
section{padding:78px 0;}
section.air{padding:132px 0;}
section.close-up{padding:52px 0;}
section.earth{background:var(--earth);color:var(--dust);}

h2{
  font-family:var(--display);
  font-weight:500;
  font-size:clamp(36px, 5vw, 56px);
  line-height:1.14;
  color:var(--vermilion);
  margin:0 0 34px;
  letter-spacing:0.01em;
}
h2::after{
  content:'';display:block;width:118px;height:3px;
  background:var(--vermilion);margin:24px 0 0;
}
.earth h2{color:var(--gold);}
.earth h2::after{background:var(--gold);}
.center-head{text-align:center;}
.center-head h2::after{margin-left:auto;margin-right:auto;}

.eyebrow{
  font-family:var(--body);font-size:12px;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--rust);display:block;margin:0 0 14px;
}
.earth .eyebrow{color:var(--gold);}
.attrib{
  font-family:var(--body);font-size:13px;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--vermilion);margin:0;
}
.attrib span{
  display:block;margin-top:7px;font-size:14px;letter-spacing:0.02em;
  text-transform:none;font-style:italic;color:var(--ink-soft);
}
.earth .attrib{color:var(--gold);}
.earth .attrib span{color:var(--dust);opacity:.72;}

/* ── the marigold hairline frame ────────────────────────────── */
.framed{position:relative;}
.framed::after{
  content:'';position:absolute;inset:12px;
  border:1px solid var(--marigold);pointer-events:none;
}

/* ── the marigold diamond ───────────────────────────────────── */
ul.marked{list-style:none;padding:0;margin:0 0 22px;}
ul.marked li{position:relative;padding:0 0 0 30px;margin:0 0 14px;line-height:1.7;}
ul.marked li::before{
  content:'';position:absolute;left:2px;top:14px;width:9px;height:9px;
  border:1.5px solid var(--marigold);border-radius:50% 0;transform:rotate(45deg);
}
ul.marked.green li::before{border-color:var(--cedar);}

/* ══ HERO — the page begins in the ground ═══════════════════ */
.hero{
  background:var(--earth);
  padding:0 0 84px;
  text-align:center;
}
.hero .earthplate img{width:100%;height:auto;}
.name{
  font-family:var(--display);font-weight:300;
  font-size:clamp(46px, 8.4vw, 104px);
  line-height:1.02;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--cream);margin:-2.4vw 0 6px;text-indent:0.16em;
  position:relative;
}
.tagline{
  font-family:var(--display);font-style:italic;font-weight:300;
  font-size:clamp(24px, 3.4vw, 34px);color:var(--gold);margin:0;
}

/* ── the welcome ────────────────────────────────────────────── */
.welcome{
  font-family:var(--display);font-weight:400;
  font-size:clamp(28px, 3.7vw, 40px);
  line-height:1.42;color:var(--ink);text-align:center;
  margin:0 auto;max-width:720px;text-wrap:balance;
}

/* ── verse / pulls / breath ─────────────────────────────────── */
.pull{
  font-family:var(--display);font-weight:300;
  font-size:clamp(26px, 3.8vw, 38px);line-height:1.42;color:var(--ink);margin:0;
}
.pull em{font-style:italic;color:var(--vermilion);}
.big-line{
  font-family:var(--display);font-weight:300;
  font-size:clamp(24px, 3.2vw, 32px);line-height:1.5;
  color:var(--ink);text-align:center;margin:34px 0;
}
.earth .big-line{color:var(--cream);}
.breath{
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:clamp(21px, 2.6vw, 26px);color:var(--rust);text-align:center;margin:30px 0;
}
.earth .breath{color:var(--gold);}
.prayer{
  font-family:var(--display);font-style:italic;font-weight:400;
  font-size:clamp(21px, 2.4vw, 25px);line-height:1.5;color:var(--rust);margin:0 0 30px;
}

/* ── two-column split ───────────────────────────────────────── */
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;}
.split.top{align-items:start;}
.split.wide-art{grid-template-columns:0.82fr 1fr;}
.split.seal-art{grid-template-columns:1fr 1.3fr;}
.split .copy p:last-child{margin-bottom:0;}
.pull.under-art{
  font-size:clamp(22px, 2.5vw, 27px);line-height:1.44;
  text-align:center;margin:34px 0 0;
}

/* ── the voice. one at a time, never a grid ─────────────────── */
.voice{
  max-width:680px;margin:0 auto;text-align:center;padding:38px 0 34px;
  border-top:1px solid rgba(198,60,26,0.45);
  border-bottom:1px solid rgba(198,60,26,0.45);
}
.voice::before{
  content:'\201C';display:block;font-family:var(--display);font-weight:600;
  font-size:clamp(64px, 7vw, 84px);line-height:0.55;color:var(--marigold);margin:14px 0 18px;
}
.voice blockquote{
  font-family:var(--display);font-style:italic;font-weight:500;
  font-size:clamp(23px, 2.9vw, 29px);line-height:1.5;color:var(--ink);margin:0 0 26px;
}
.earth .voice{border-color:rgba(226,193,67,0.42);}
.earth .voice::before{color:var(--gold);}
.earth .voice blockquote{color:var(--cream);}
.earth.air .voice{max-width:860px;}
.earth.air .voice blockquote{
  font-size:clamp(28px, 4.2vw, 46px);
  font-weight:400;
  line-height:1.36;
}

/* ── includes card — the canon recipe: marigold on marigold ── */
.includes-card{
  border:1px solid var(--marigold);
  background:var(--wash);
  padding:38px 36px 0;
}
/* facts — canon §5, as a strip inside the card rather than a
   second bordered box nested in the first. */
.facts{
  display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start;
  border-top:1px solid var(--marigold);
  margin:32px -36px 0;padding:26px 36px 0;text-align:center;
}
.fact-lead{
  font-family:var(--display);font-weight:600;font-size:23px;line-height:1.3;
  color:var(--ink);margin:0 0 4px;
}
.fact-sub{font-size:17px;line-height:1.5;color:var(--ink-soft);margin:0;}
.price-rule{
  border-top:1px solid var(--marigold);
  margin:26px -36px 0;padding:24px 36px 28px;text-align:center;
}
.price{
  font-family:var(--display);font-weight:300;
  font-size:clamp(30px, 3.6vw, 40px);color:var(--ink);margin:0;letter-spacing:0.02em;
}
.price .dot{color:var(--marigold);padding:0 12px;}
.price-rule .cta{margin-top:24px;}

/* ── the doorways — what a Soul Story opens onto ────────────── */
.doorways .intro{
  text-align:center;max-width:560px;margin:0 auto 62px;
  font-size:17px;line-height:1.8;color:var(--ink-soft);
}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;align-items:stretch;}
.door{
  position:relative;display:flex;flex-direction:column;text-align:center;
  background:var(--earth);border:1px solid var(--marigold);
  padding:42px 28px 38px;
}
.door::before{
  content:'';position:absolute;inset:7px;
  border:1px solid rgba(224,147,15,0.42);
  pointer-events:none;transition:border-color .4s ease;
}
.door:hover::before,.door:focus-within::before{border-color:var(--marigold);}
.glyph{height:80px;margin-bottom:26px;display:flex;align-items:center;justify-content:center;}
.glyph svg{height:74px;width:74px;overflow:visible;}
.glyph path,.glyph circle{
  fill:none;stroke:var(--marigold);stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.glyph .fill{fill:var(--marigold);stroke:none;}
.glyph .carve{fill:var(--earth);stroke:none;}
.door .kind{
  font-family:var(--body);font-size:12px;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--gold);margin:0 0 18px;
}
.door h3{
  font-family:var(--display);font-weight:500;font-size:26px;line-height:1.28;
  color:var(--cream);margin:0 0 10px;min-height:2.56em;
  display:flex;align-items:center;justify-content:center;
}
.door .line{
  font-family:var(--display);font-style:italic;font-weight:300;font-size:21px;
  color:var(--gold);margin:0 0 24px;line-height:1.4;
}
.door .teaser{font-size:16px;line-height:1.75;color:var(--dust);margin:0 0 34px;}
.door .go{
  margin-top:auto;align-self:center;
  font-family:var(--body);font-size:12px;letter-spacing:0.18em;
  text-transform:uppercase;text-decoration:none;color:var(--gold);
  padding-bottom:7px;border-bottom:1px solid var(--marigold);
  transition:color .3s ease, border-color .3s ease;
}
.door .go::after{content:' \2192';letter-spacing:0;}
.door .go:hover,.door .go:focus-visible{color:var(--cream);border-color:var(--gold);}

/* ── the seal ───────────────────────────────────────────────── */
.seal{position:relative;width:100%;max-width:640px;margin:0 auto;aspect-ratio:1;}
.seal .disc{position:absolute;inset:4%;border-radius:50%;overflow:hidden;}
.seal .disc img{
  width:100%;height:100%;object-fit:cover;
  /* the danmala's centre pod sits at 54%/51.2% of a square frame, not 50/50.
     cover crops nothing on a 1:1 source, so object-position is inert here —
     the flower is brought to true centre by hand. canon §4. */
  transform:translate(-4.4%, -1.3%) scale(1.10);
}
.seal .ring{
  position:absolute;inset:2.6%;border-radius:50%;
  border:1px solid var(--marigold);pointer-events:none;
}
.seal .ring-out{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid var(--plum);opacity:.6;pointer-events:none;
}

/* ── buttons ────────────────────────────────────────────────── */
.cta{
  display:inline-block;padding:15px 40px;
  border:1px solid var(--rust);color:var(--rust);text-decoration:none;
  font-family:var(--body);font-size:13px;letter-spacing:0.16em;
  text-transform:uppercase;background:transparent;
  transition:background .25s ease, color .25s ease;
}
.cta:hover,.cta:focus-visible{background:var(--rust);color:var(--cream);}
.cta.solid{background:var(--vermilion);border-color:var(--vermilion);color:var(--cream);}
.cta.solid:hover,.cta.solid:focus-visible{background:var(--rust);border-color:var(--rust);}
.earth .cta{border-color:var(--gold);color:var(--gold);background:transparent;}
.earth .cta:hover,.earth .cta:focus-visible{background:var(--gold);color:var(--earth);}
.cta-row{text-align:center;margin-top:44px;}
a:focus-visible{outline:2px solid var(--gold);outline-offset:4px;}

/* ── signs ──────────────────────────────────────────────────── */
.signs{display:grid;gap:38px;}
.sign h3{
  font-family:var(--display);font-weight:600;font-size:25px;line-height:1.25;
  color:var(--ink);margin:0 0 8px;position:relative;padding-left:30px;
}
.sign h3::before{
  content:'';position:absolute;left:2px;top:12px;width:10px;height:10px;
  border:1.5px solid var(--marigold);border-radius:50% 0;transform:rotate(45deg);
}
.sign p{margin:0;padding-left:30px;}

/* ── bio ────────────────────────────────────────────────────── */
.bio p:first-of-type{
  font-family:var(--display);font-weight:500;font-size:25px;line-height:1.45;
  color:var(--ink);margin-bottom:26px;
}
.bio .more{
  font-family:var(--body);font-size:15px;line-height:1.7;
  color:var(--ink-soft);margin:26px 0 0;font-style:italic;
}
.bio .more a{color:var(--rust);text-decoration:none;border-bottom:1px solid var(--marigold);}
.bio .more a:hover,.bio .more a:focus-visible{color:var(--vermilion);}

/* ── closing ────────────────────────────────────────────────── */
.closing{text-align:center;}
.closing .lines{
  font-family:var(--display);font-weight:300;
  font-size:clamp(22px, 2.9vw, 29px);line-height:1.72;color:var(--cream);margin:34px 0 0;
}
.closing .lines span{display:block;}
.final{
  font-family:var(--display);font-style:italic;font-weight:300;
  font-size:clamp(30px, 4.4vw, 48px);line-height:1.32;color:var(--gold);margin:50px 0 0;
}
footer{
  background:var(--earth);
  border-top:1px solid rgba(226,193,67,0.28);
  text-align:center;padding:34px 28px 44px;
}
footer .mark{
  font-family:var(--body);font-size:12px;letter-spacing:0.24em;
  text-transform:uppercase;color:var(--gold);margin:0;
}
footer .credit{
  font-family:var(--body);font-size:11px;letter-spacing:0.06em;
  text-transform:none;color:var(--dust);opacity:.7;margin:14px 0 0;line-height:1.6;
}
footer .credit a{color:var(--dust);text-decoration:underline;text-underline-offset:2px;}

/* ── responsive ─────────────────────────────────────────────── */
@media (max-width:900px){
  .doors{grid-template-columns:1fr;gap:20px;max-width:460px;margin:0 auto;}
  .door h3{min-height:0;}
  .split, .split.wide-art, .split.seal-art{grid-template-columns:1fr;gap:38px;}
  .split .art{order:-1;}
  /* the blessing is a closing beat — on one column it must not
     arrive before the heading it answers. */
  .split.top.wide-art .art{display:contents;}
  .split.top.wide-art .framed{order:-1;}
  .split.top.wide-art .copy{order:0;}
  .split.top.wide-art .pull.under-art{order:1;margin-top:0;}
  section.air{padding:88px 0;}
  .name{margin-top:14px;}
}
@media (max-width:700px){
  .welcome br{display:none;}
}
@media (max-width:560px){
  body{font-size:18px;}
  section{padding:58px 0;}
  section.air{padding:72px 0;}
  .includes-card{padding:34px 24px 0;}
  .facts{margin:30px -24px 0;padding:24px 24px 0;}
  .price-rule{margin:24px -24px 0;padding:22px 24px 26px;}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}

/* ---- placeholder for images not yet on the CDN ---- */
.ph{
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:
    repeating-linear-gradient(45deg,rgba(120,90,20,.05) 0 12px,rgba(120,90,20,.10) 12px 24px);
  border:1px dashed currentColor;color:#9a7626;min-height:120px;
}
.ph span{font-family:Georgia,serif;font-size:14px;font-style:italic;line-height:1.5;
  padding:24px;max-width:32ch;}
.ph span b{display:block;font-style:normal;letter-spacing:.12em;text-transform:uppercase;
  font-size:11px;margin-bottom:8px;opacity:.8;}
.reveal{opacity:1 !important;transform:none !important;}
.hero__art,.hero__head{opacity:1 !important;transform:none !important;animation:none !important;}
</style>

<!-- ══════════ THE WELCOME ══════════ -->
<section class="air">
  <div class="wrap">
    <p class="welcome">Welcome into the world of the ancient practice<br>of storytelling as a sacred healing art.</p>
  </div>
</section>
<!-- ===== leah-embeds height reporter ===== -->
<script>
(function(){
  function H(){
    var d=document, b=d.body, e=d.documentElement;
    return Math.max(
      b?b.scrollHeight:0, e.scrollHeight,
      b?b.offsetHeight:0, e.offsetHeight,
      b?Math.ceil(b.getBoundingClientRect().bottom):0
    );
  }
  var last=-1, lastW=-1;
  function post(){
    var v=H(), w=document.documentElement.clientWidth;
    // Re-post whenever height OR viewport width changes. Some blocks size purely
    // from vw + aspect-ratio; if the iframe's width lands after first paint, the
    // height must be recomputed once the real width arrives.
    if(v!==last || w!==lastW){
      last=v; lastW=w;
      try{ parent.postMessage({cdBlock:true,h:v}, "*"); }catch(_){}
    }
  }
  addEventListener("load", post);
  addEventListener("resize", post);
  if(window.ResizeObserver){
    try{
      var ro=new ResizeObserver(post);
      ro.observe(document.body);
      ro.observe(document.documentElement);   // catches width-driven relayout
    }catch(_){}
  }
  // re-measure once every image has decoded (aspect-ratio/background swaps)
  [].forEach.call(document.images, function(im){
    if(!im.complete) im.addEventListener("load", post);
  });
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(post); }
  document.addEventListener("DOMContentLoaded", post);
  // safety net for late images / async layout / delayed width (30s, tapering)
  var n=0, iv=setInterval(function(){ post(); if(++n>60) clearInterval(iv); }, 500);
})();
</script>
</body>
</html>
