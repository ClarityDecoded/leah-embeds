<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>Soul Story Council — Soul Story Council</title>
<style>html,body{margin:0;padding:0;background:transparent;}</style>
</head>
<body>
<!-- ===== BLOCK 1 — Soul Story Council ===== (page: soul-story-council) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
    --night:#0E1113;
    --deep:#161B1F;
    --paper:#EFECE5;
    --paper-warm:#E7E3DA;
    --ink:#23272C;
    --ink-soft:#565E66;
    --cream:#EDE7DA;
    --gold:#C9A44C;
    --gold-deep:#9A7626;
    --stone-blue:#5B7A94;
    --plum:#6C4C66;
    --rule:rgba(35,39,44,.16);
    --rule-dark:rgba(237,231,218,.16);

    --display:'Cormorant Garamond',Garamond,serif;
    --body:'Spectral',Georgia,serif;
    --util:'Archivo',system-ui,sans-serif;

    --measure:44rem;
    --gutter:clamp(1.25rem,5vw,3rem);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-weight:300;
    font-size:clamp(1.02rem,.98rem + .3vw,1.14rem);
    line-height:1.74;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}

  .wrap{max-width:64rem;margin:0 auto;padding-inline:var(--gutter);}
  .col{max-width:var(--measure);}
  .col-center{max-width:var(--measure);margin-inline:auto;}

  h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;margin:0;}

  .eyebrow{
    font-family:var(--util);
    font-size:.68rem;
    font-weight:500;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin:0;
  }

  /* ---------- banner ---------- */
  .banner{background:var(--night);text-align:center;}
  .banner-figure{position:relative;display:block;}
  .banner-figure img{
    width:100%;
    height:clamp(19rem,46vw,40rem);
    object-fit:cover;
    object-position:center 45%;
  }
  .banner-title{padding:0 var(--gutter) clamp(3rem,7vw,5rem);margin-top:-1px;}
  .banner-title h1{
    color:var(--cream);
    font-weight:300;
    font-size:clamp(1.9rem,.55rem + 5.4vw,5.2rem);
    letter-spacing:.16em;
    text-transform:uppercase;
    margin-inline:auto;
    text-indent:.16em; /* balances the trailing letter-space */
  }
  .banner-title .tagline{
    font-family:var(--display);
    font-style:italic;
    font-weight:300;
    color:var(--gold);
    font-size:clamp(1.2rem,.9rem + 1.5vw,2.1rem);
    line-height:1.4;
    max-width:30rem;
    margin:clamp(1rem,2.5vw,1.6rem) auto 0;
  }

  /* ---------- sections ---------- */
  .band{padding-block:clamp(3.25rem,7vw,5.5rem);}
  .band + .band > .wrap{border-top:1px solid var(--rule);padding-top:clamp(3.25rem,7vw,5.5rem);}
  .band + .band{padding-top:0;}
  .band h2{
    font-size:clamp(1.9rem,1.3rem + 2vw,2.9rem);
    margin-bottom:clamp(1.5rem,3.5vw,2.25rem);
    letter-spacing:.005em;
  }
  .band .eyebrow{margin-bottom:.9rem;}
  .band .eyebrow:last-of-type{margin-bottom:clamp(1.5rem,3.5vw,2.25rem);}

  .opening p,.happens p{margin:0 0 1.35em;}
  .happens p:last-child{margin-bottom:0;}
  .opening .lede{
    font-size:1.12em;
    line-height:1.62;
    color:var(--ink);
    margin-bottom:1.6em;
  }
  .opening p:last-child{margin-bottom:0;}

  .pull{
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(1.75rem,1.2rem + 2.2vw,2.9rem);
    line-height:1.24;
    margin:clamp(2.25rem,5vw,3.25rem) auto;
    padding-left:1.5rem;
    border-left:1px solid var(--gold);
  }
  .pull em{font-style:italic;color:var(--gold-deep);}

  /* ---------- lists ---------- */
  .pair{display:grid;gap:clamp(2.5rem,5vw,4.5rem);grid-template-columns:1fr;}
  @media(min-width:56rem){ .pair{grid-template-columns:1fr 1fr;} }
  .pair h3{
    font-size:1.6rem;
    margin-bottom:1.3rem;
    padding-bottom:.8rem;
    border-bottom:1px solid var(--rule);
  }
  .listing{list-style:none;margin:0;padding:0;}
  .listing li{position:relative;padding-left:1.6rem;margin-bottom:1.1rem;}
  .listing li:last-child{margin-bottom:0;}
  .listing li::before{
    content:"";position:absolute;left:0;top:.72em;
    width:6px;height:6px;border-radius:50%;
    border:1px solid var(--stone-blue);
  }
  .listing.filled li::before{background:var(--stone-blue);}

  /* ---------- altar ---------- */
  .altar{display:grid;gap:clamp(2rem,5vw,4rem);align-items:center;grid-template-columns:1fr;}
  @media(min-width:56rem){ .altar{grid-template-columns:1.05fr .95fr;} }
  .altar .say{
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(1.6rem,1.2rem + 1.5vw,2.3rem);
    line-height:1.3;
  }

  /* ---------- weave signature ---------- */
  .weave{display:grid;gap:clamp(2rem,5vw,4rem);align-items:center;grid-template-columns:1fr;}
  @media(min-width:56rem){ .weave{grid-template-columns:.9fr 1.1fr;} }
  .weave-art{width:min(23rem,78vw);margin-inline:auto;}
  .weave-art svg{width:100%;height:auto;overflow:visible;}
  .thread{
    stroke:var(--stone-blue);stroke-width:1;fill:none;
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);opacity:.8;
  }
  .node{fill:var(--gold-deep);opacity:0;}
  .ring{stroke:var(--rule);fill:none;stroke-width:1;}
  .drawn .thread{animation:draw 1.5s cubic-bezier(.22,.61,.36,1) forwards;animation-delay:var(--d);}
  .drawn .node{animation:bloom .7s ease forwards;animation-delay:calc(var(--d) + 1.1s);}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @keyframes bloom{to{opacity:1;}}

  /* ---------- dark ceremony band ---------- */
  .band--dark{background:var(--night);color:var(--cream);}
  .band--dark .eyebrow{color:var(--gold);}
  .band--dark .listing li::before{border-color:var(--gold);}
  .band--dark h2{color:var(--cream);}
  .band + .band--dark > .wrap{border-top:0;padding-top:0;}
  .band--dark{padding-block:clamp(3.5rem,7vw,5.5rem)!important;}
  .diptych{display:grid;gap:clamp(1.25rem,3vw,2rem);grid-template-columns:1fr;align-items:start;}
  @media(min-width:56rem){ .diptych{grid-template-columns:1fr 1fr;} }
  .diptych img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(.9) brightness(.96);}
  .credit{
    font-family:var(--util);font-size:.66rem;letter-spacing:.16em;
    text-transform:uppercase;color:rgba(237,231,218,.55);margin:1.25rem 0 0;
  }

  /* ---------- testimonials ---------- */
  .voices{display:grid;gap:clamp(2rem,4vw,3rem);grid-template-columns:1fr;}
  @media(min-width:56rem){ .voices{grid-template-columns:1fr 1fr;} }
  blockquote{margin:0;}
  blockquote p{margin:0 0 1.25rem;font-style:italic;color:#39414A;font-size:1.05rem;line-height:1.68;}
  .attrib{
    font-family:var(--util);font-style:normal;font-size:.76rem;
    line-height:1.65;letter-spacing:.03em;color:var(--ink-soft);
  }
  .attrib strong{
    color:var(--ink);font-weight:500;letter-spacing:.09em;
    text-transform:uppercase;font-size:.72rem;display:block;margin-bottom:.3rem;
  }

  /* ---------- practicalities ---------- */
  .facts{display:grid;gap:1.5rem clamp(2rem,4vw,3.5rem);grid-template-columns:1fr;border-top:1px solid var(--rule);padding-top:2rem;}
  @media(min-width:44rem){ .facts{grid-template-columns:repeat(3,1fr);} }
  .fact dt{
    font-family:var(--util);font-size:.68rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold-deep);margin-bottom:.5rem;
  }
  .fact dd{margin:0;font-size:1rem;line-height:1.62;color:#39414A;}
  .facts-note{margin:2rem 0 0;font-style:italic;color:var(--ink-soft);font-size:1.02rem;}
  .facts-note + .facts-note{margin-top:1.1rem;}

  /* ---------- join ---------- */
  .join-band{padding-block:clamp(3.5rem,8vw,6rem) clamp(4rem,9vw,7rem);}
  .join-band > .wrap{border-top:1px solid var(--rule);padding-top:clamp(3.5rem,8vw,6rem);}
  .door{
    background:var(--night);
    color:var(--cream);
    max-width:44rem;
    margin-inline:auto;
    padding:clamp(2.25rem,5vw,3.5rem);
    text-align:center;
  }
  .door .eyebrow{color:var(--gold);}
  .door h2{
    color:var(--cream);
    font-size:clamp(1.6rem,.9rem + 2.6vw,2.6rem);
    letter-spacing:.13em;
    text-transform:uppercase;
    text-indent:.13em;
    font-weight:300;
    margin:1rem 0 1rem;
  }
  .door .sub{color:rgba(237,231,218,.75);max-width:27rem;margin:0 auto clamp(2rem,4vw,2.75rem);}
  .price{
    font-family:var(--display);
    font-size:clamp(2.6rem,2rem + 2.4vw,3.8rem);
    line-height:1;display:block;color:var(--gold);
  }
  .price span{
    font-family:var(--util);font-size:.72rem;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(237,231,218,.55);display:block;margin-top:.75rem;
  }
  .includes{
    list-style:none;margin:clamp(2rem,4vw,2.5rem) auto;padding:1.75rem 0;
    border-top:1px solid var(--rule-dark);border-bottom:1px solid var(--rule-dark);
    max-width:24rem;text-align:left;
  }
  .includes li{position:relative;padding-left:1.5rem;margin-bottom:.7rem;color:rgba(237,231,218,.85);font-size:1rem;}
  .includes li:last-child{margin-bottom:0;}
  .includes li::before{
    content:"";position:absolute;left:0;top:.7em;
    width:5px;height:5px;border-radius:50%;background:var(--gold);
  }
  .cta{
    display:inline-block;font-family:var(--util);font-size:.76rem;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;color:var(--night);
    background:var(--gold);padding:1.15rem 2.5rem;text-decoration:none;
    transition:background .25s ease;
  }
  .cta:hover{background:var(--cream);}
  .cta:focus-visible{outline:2px solid var(--cream);outline-offset:3px;}

  .foot{
    text-align:center;padding:0 var(--gutter) 3.5rem;color:var(--ink-soft);
    font-size:1rem;font-family:var(--body);line-height:1.7;
    max-width:38rem;margin-inline:auto;
  }
  .foot a{color:var(--gold-deep);text-decoration:none;border-bottom:1px solid rgba(154,118,38,.35);}
  .foot a:hover,.foot a:focus-visible{border-color:var(--gold-deep);}


  /* ---------- banner meta ---------- */
  .banner-meta{
    font-family:var(--util);font-size:.72rem;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;
    margin:clamp(1.4rem,3vw,2rem) 0 0;
  }
  .banner-meta a{
    color:rgba(237,231,218,.6);text-decoration:none;
    border-bottom:1px solid rgba(201,164,76,.45);padding-bottom:.35rem;
    transition:color .25s ease,border-color .25s ease;
  }
  .banner-meta a:hover,.banner-meta a:focus-visible{color:var(--cream);border-color:var(--gold);}

  /* ---------- calendar ---------- */
  .calendar{margin:clamp(2.25rem,4vw,3rem) 0 0;max-width:var(--measure);}
  .calendar h3{
    font-family:var(--util);font-size:.68rem;font-weight:500;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold-deep);margin-bottom:1rem;
  }
  .dates{list-style:none;margin:0;padding:0;}
  .dates li{
    display:flex;justify-content:space-between;align-items:baseline;gap:1.5rem;
    padding:.62rem 0;border-bottom:1px solid var(--rule);
    font-size:1rem;color:#39414A;
  }
  .dates li:last-child{border-bottom:0;}
  .dates .when{white-space:nowrap;}
  .dates .what{
    font-family:var(--util);font-size:.68rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);text-align:right;
  }
  .dates .mark .what{color:var(--gold-deep);}

  /* ---------- next gathering, terms, further doors ---------- */
  .next{
    font-family:var(--util);font-size:.72rem;font-weight:500;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold);margin:0 0 1.6rem;
  }
  .terms{
    font-family:var(--util);font-size:.68rem;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(237,231,218,.5);margin:1.6rem 0 0;
  }
  .door .calendar{margin:clamp(2rem,4vw,2.5rem) auto 0;max-width:26rem;text-align:left;}
  .door .calendar h3{color:var(--gold);}
  .door .dates li{border-bottom:1px solid var(--rule-dark);color:var(--cream);}
  .door .dates li:last-child{border-bottom:0;}
  .door .dates .what{color:rgba(237,231,218,.55);}
  .door .dates .mark .what{color:var(--gold);}

  .more{
    text-align:center;max-width:38rem;
    margin:clamp(2.25rem,4vw,3rem) auto 0;
    font-size:1rem;line-height:1.7;color:var(--ink-soft);
  }
  .more a{color:var(--gold-deep);text-decoration:none;border-bottom:1px solid rgba(154,118,38,.35);}
  .more a:hover,.more a:focus-visible{border-color:var(--gold-deep);}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .thread{stroke-dashoffset:0;}
    .node{opacity:1;}
  }

/* ---- placeholder for images not yet on the CDN ---- */
.ph{
  display:flex;align-items:center;justify-content:center;text-align:center;
  background:
    repeating-linear-gradient(45deg,rgba(120,90,20,.05) 0 12px,rgba(120,90,20,.10) 12px 24px);
  border:1px dashed currentColor;color:#9a7626;min-height:120px;
}
.ph span{font-family:Georgia,serif;font-size:14px;font-style:italic;line-height:1.5;
  padding:24px;max-width:32ch;}
.ph span b{display:block;font-style:normal;letter-spacing:.12em;text-transform:uppercase;
  font-size:11px;margin-bottom:8px;opacity:.8;}
.reveal{opacity:1 !important;transform:none !important;}
.hero__art,.hero__head{opacity:1 !important;transform:none !important;animation:none !important;}
</style>

<header class="banner">
  <div class="banner-figure">
    <img src="https://framerusercontent.com/images/1vkAJZIfLCcoWC5CCscI9ANQ.png" alt="A mandala of blue stones, feathers, pinecones and maple leaves laid in a circle on stone, the stone ground reaching out and falling away into darkness">
  </div>
  <div class="banner-title">
    <h1>Soul Story Council</h1>
    <p class="tagline">Story, Ceremony &amp; the Wisdom That Emerges Between Us</p>
    <p class="banner-meta"><a href="https://leahlamb.simplero.com/cart/258954-Soul-Story-Council">New Moons &middot; $33 a month</a></p>
  </div>
</header>
<!-- ===== leah-embeds height reporter ===== -->
<script>
(function(){
  function H(){
    var d=document, b=d.body, e=d.documentElement;
    return Math.max(
      b?b.scrollHeight:0, e.scrollHeight,
      b?b.offsetHeight:0, e.offsetHeight,
      b?Math.ceil(b.getBoundingClientRect().bottom):0
    );
  }
  var last=-1, lastW=-1;
  function post(){
    var v=H(), w=document.documentElement.clientWidth;
    // Re-post whenever height OR viewport width changes. Some blocks size purely
    // from vw + aspect-ratio; if the iframe's width lands after first paint, the
    // height must be recomputed once the real width arrives.
    if(v!==last || w!==lastW){
      last=v; lastW=w;
      try{ parent.postMessage({cdBlock:true,h:v}, "*"); }catch(_){}
    }
  }
  addEventListener("load", post);
  addEventListener("resize", post);
  if(window.ResizeObserver){
    try{
      var ro=new ResizeObserver(post);
      ro.observe(document.body);
      ro.observe(document.documentElement);   // catches width-driven relayout
    }catch(_){}
  }
  // re-measure once every image has decoded (aspect-ratio/background swaps)
  [].forEach.call(document.images, function(im){
    if(!im.complete) im.addEventListener("load", post);
  });
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(post); }
  document.addEventListener("DOMContentLoaded", post);
  // safety net for late images / async layout / delayed width (30s, tapering)
  var n=0, iv=setInterval(function(){ post(); if(++n>60) clearInterval(iv); }, 500);
})();
</script>
</body>
</html>
