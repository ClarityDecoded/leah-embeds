<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title></head>
<body style="margin:0">
<div id="mount" style="width:100%"></div>
<script>
var f=document.createElement('iframe');
f.src="embeds/luminaries/07.html";
f.setAttribute('scrolling','no');
f.style.cssText="display:block;width:1000px;border:0;height:0;";
document.getElementById('mount').appendChild(f);
window.__probe=function(){
  var d=f.contentDocument, w=f.contentWindow;
  var el=d.querySelector('.break-img');
  return JSON.stringify({
    iframeClientW:f.clientWidth,
    childInnerW:w.innerWidth,
    breakImgW:el.clientWidth, breakImgH:el.clientHeight,
    bodyScrollH:d.body.scrollHeight
  });
};
</script>
</body></html>
